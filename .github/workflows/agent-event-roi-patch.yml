name: Apply event ROI actions wheel patch
on:
  push:
    branches: [agent/event-roi-actions-wheel]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[agent-patch-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/event-roi-actions-wheel
      - name: Apply patch
        run: python tools/agent_event_roi_patch.py
      - name: Validate JavaScript syntax
        run: |
          node --check custom_components/webrtc/www/digital-ptz.js
          node --check custom_components/webrtc/www/webrtc-camera.js
      - name: Commit patched files and remove helpers
        run: |
          rm -f tools/agent_event_roi_patch.py .github/workflows/agent-event-roi-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Add event ROI framing, action sequences and integrated wheel zoom [agent-patch-done]'
          git push
