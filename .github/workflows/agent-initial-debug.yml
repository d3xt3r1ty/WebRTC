name: Patch initial stream diagnostics
on:
  push:
    branches: [agent/initial-stream-fix-3.6.14]
    paths: [.github/workflows/agent-initial-debug.yml]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
