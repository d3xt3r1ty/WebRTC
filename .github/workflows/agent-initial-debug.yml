    oninit() {
        super.oninit();
        this.video.controls = false;
        this.video.muted = true;
        this.video.autoplay = true;
        this.video.playsInline = true;
        this.video.style.objectFit = 'contain';
        this.video.style.background = 'black';
        const firstFrame = () => {
            if (this._firstFrameSeen) return;
            const report = () => {
                if (this._firstFrameSeen) return;
                this._firstFrameSeen = true;
                this.dispatchEvent(new CustomEvent('initial-frame'));
            };
            if (typeof this.video.requestVideoFrameCallback === 'function') this.video.requestVideoFrameCallback(report);
            else requestAnimationFrame(report);
        };
        this.video.addEventListener('loadeddata', firstFrame);
        this.video.addEventListener('playing', firstFrame);
    }
    onopen() {
        this.dispatchEvent(new CustomEvent('initial-open'));
        return super.onopen();
    }
}
