name: Patch initial stream overlay
on:
  push:
    branches: [agent/initial-stream-first-frame]
    paths: [.github/workflows/agent-initial-overlay.yml]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('custom_components/webrtc/www/webrtc-camera.js')
          s=p.read_text()
          # Put initial stream above the main transform instead of relying on transparency through it.
          s=s.replace("""            .player .ptz-transform {
                height: 100%;
                position: relative;
                z-index: 1;
            }
            .initial-stream {
                position: absolute;
                inset: 0;
                z-index: 0;
""", """            .player .ptz-transform {
                height: 100%;
                position: relative;
                z-index: 1;
            }
            .initial-stream {
                position: absolute;
                inset: 0;
                z-index: 2;
""", 1)
          # Do not hide the main video itself; the overlay covers it until handoff.
          s=s.replace("""            this.querySelector('.player').insertBefore(this.initialStream, this.querySelector('.ptz-transform'));
            this.video.style.opacity = '0';
            this.video.style.transition = 'opacity 120ms linear';
""", """            this.querySelector('.player').appendChild(this.initialStream);
""", 1)
          s=s.replace("""                this.video.style.opacity = '1';
                this.initialStream.style.opacity = '0';
""", """                this.initialStream.style.opacity = '0';
""", 1)
          s=s.replace("""                    this.initialStream.style.display = 'block';
                    this.initialStream.style.opacity = '1';
                    this.video.style.opacity = '0';
""", """                    this.initialStream.style.display = 'block';
                    this.initialStream.style.opacity = '1';
""", 1)
          # Bump version.
          p.write_text(s)
          m=Path('custom_components/webrtc/manifest.json')
          ms=m.read_text()
          if '"version": "3.6.13"' not in ms:
              raise SystemExit('manifest version is not 3.6.13')
          m.write_text(ms.replace('"version": "3.6.13"','"version": "3.6.14"',1))
          PY
      - name: Validate
        run: |
          node --check custom_components/webrtc/www/webrtc-camera.js
          python -m json.tool custom_components/webrtc/manifest.json >/dev/null
      - name: Commit
        run: |
          git config user.name D3XT3R
          git config user.email d3xt3rsl4b@gmail.com
          git add custom_components/webrtc/www/webrtc-camera.js custom_components/webrtc/manifest.json
          git commit -m "Render initial stream as overlay"
          git push
