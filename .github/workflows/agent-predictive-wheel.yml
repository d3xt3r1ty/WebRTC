name: Apply predictive wheel patch
on:
  push:
    branches: [agent/predictive-wheel-target]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/predictive-wheel-target
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python3 tools/agent_predictive_wheel.py
      - name: Validate JavaScript
        run: node --check custom_components/webrtc/www/webrtc-camera.js
      - name: Validate manifest
        run: python3 -m json.tool custom_components/webrtc/manifest.json >/dev/null
      - name: Commit patched files
        run: |
          git config user.name "D3XT3R"
          git config user.email "d3xt3rsl4b@gmail.com"
          git add custom_components/webrtc/www/webrtc-camera.js custom_components/webrtc/manifest.json
          git diff --cached --quiet || git commit -m "Add predictive absolute wheel zoom"
          git push
