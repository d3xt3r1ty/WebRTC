name: Apply slider actual-fill patch
on:
  push:
    branches: [agent/predictive-wheel-target]
    paths: [.github/workflows/agent-slider-actual-fill.yml]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/predictive-wheel-target
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python tools/agent_slider_actual_fill.py
      - name: Validate JavaScript
        run: node --check custom_components/webrtc/www/webrtc-camera.js
      - name: Validate manifest
        run: python -m json.tool custom_components/webrtc/manifest.json >/dev/null
      - name: Commit patched file
        run: |
          git config user.name D3XT3R
          git config user.email d3xt3rsl4b@gmail.com
          git add custom_components/webrtc/www/webrtc-camera.js
          git commit -m "Show target thumb and actual zoom fill"
          git push
