name: Apply variable velocity wheel zoom patch
on:
  push:
    branches:
      - agent/variable-velocity-wheel-zoom
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[agent-wheel-done]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/agent_variable_velocity_wheel.py
      - run: node --check custom_components/webrtc/www/webrtc-camera.js
      - run: python -m json.tool custom_components/webrtc/manifest.json >/dev/null
      - run: rm -f tools/agent_variable_velocity_wheel.py .github/workflows/agent-variable-velocity-wheel.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/webrtc/www/webrtc-camera.js custom_components/webrtc/manifest.json tools/agent_variable_velocity_wheel.py .github/workflows/agent-variable-velocity-wheel.yml
          git commit -m "Add variable velocity mouse-wheel zoom [agent-wheel-done]"
          git push
