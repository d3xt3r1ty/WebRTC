name: Apply standalone audio control

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-audio-control.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Add standalone audio control
        shell: python
        run: |
          from pathlib import Path
          import base64
          js_path = Path('custom_components/webrtc/www/webrtc-camera.js')
          text = js_path.read_text()
          old = "        this.renderPTZ();\n        this.renderCustomUI();\n        this.renderShortcuts();"
          new = "        this.renderPTZ();\n        this.renderCustomUI();\n        this.renderAudioControl();\n        this.renderShortcuts();"
          assert text.count(old) == 1, f'Expected one oninit insertion point, found {text.count(old)}'
          text = text.replace(old, new, 1)
          marker = "    renderShortcuts() {\n        if (!this.config.shortcuts) return;\n"
          method = base64.b64decode('').decode()
          assert text.count(marker) == 1, f'Expected one renderShortcuts marker, found {text.count(marker)}'
          text = text.replace(marker, method + marker, 1)
          js_path.write_text(text)
          manifest_path = Path('custom_components/webrtc/manifest.json')
          manifest = manifest_path.read_text()
          old_version = '"version": "v3.6.2-nav.4"'
          new_version = '"version": "v3.6.2-nav.5"'
          assert manifest.count(old_version) == 1, 'Unexpected manifest version'
          manifest_path.write_text(manifest.replace(old_version, new_version, 1))
          Path('.github/workflows/apply-audio-control.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add standalone WebRTC audio control"
          git push origin master
