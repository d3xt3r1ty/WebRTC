name: patch-3616-followup

on:
  push:
    branches:
      - agent/initial-stream-reuse-3.6.16

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply follow-up patch
        run: python .github/patch_3616_followup.py
      - name: Validate JavaScript
        run: node --check custom_components/webrtc/www/webrtc-camera.js
      - name: Validate manifest
        run: python -m json.tool custom_components/webrtc/manifest.json >/dev/null
      - name: Commit production changes
        run: |
          git config user.name D3XT3R
          git config user.email d3xt3rsl4b@gmail.com
          git add -A
          git commit -m "Complete 3.6.16 keep-alive reuse polish"
          git push
