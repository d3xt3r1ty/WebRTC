name: Patch 3.6.18 mobile joystick and initial aspect

on:
  push:
    branches:
      - agent/mobile-joystick-aspect-3.6.18
    paths:
      - .github/workflows/patch-3618.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-joystick-aspect-3.6.18
      - name: Apply patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('custom_components/webrtc/www/webrtc-camera.js')
          s = p.read_text()

          old = '''                        const sourceStyle = getComputedStyle(reusable.video);
                        if (sourceStyle.aspectRatio && sourceStyle.aspectRatio !== 'auto') {
                            this.initialStream.video.style.aspectRatio = sourceStyle.aspectRatio;
                        }
                        if (sourceStyle.objectFit) this.initialStream.video.style.objectFit = sourceStyle.objectFit;
                        if (sourceStyle.objectPosition) this.initialStream.video.style.objectPosition = sourceStyle.objectPosition;
                        this.initialStream.video.srcObject = reusableMedia;
'''
          new = '''                        const sourceStyle = getComputedStyle(reusable.video);
                        const sourceRect = reusable.video.getBoundingClientRect();
                        const renderedRatio = sourceRect.width > 0 && sourceRect.height > 0
                            ? `${sourceRect.width} / ${sourceRect.height}`
                            : sourceStyle.aspectRatio;
                        if (renderedRatio && renderedRatio !== 'auto') {
                            // The overlay itself has fixed destination dimensions, so an
                            // aspect-ratio on its 100% x 100% child would be ignored. Size
                            // the temporary video by its source card's actual rendered box.
                            this.initialStream.style.display = 'flex';
                            this.initialStream.style.alignItems = 'center';
                            this.initialStream.style.justifyContent = 'center';
                            this.initialStream.video.style.aspectRatio = renderedRatio;
                            this.initialStream.video.style.width = '100%';
                            this.initialStream.video.style.height = 'auto';
                            this.initialStream.video.style.maxWidth = '100%';
                            this.initialStream.video.style.maxHeight = '100%';
                        }
                        if (sourceStyle.objectFit) this.initialStream.video.style.objectFit = sourceStyle.objectFit;
                        if (sourceStyle.objectPosition) this.initialStream.video.style.objectPosition = sourceStyle.objectPosition;
                        this.initialStream.video.srcObject = reusableMedia;
'''
          if old not in s:
              raise SystemExit('aspect block not found')
          s = s.replace(old, new, 1)

          old = '''            const claimPointer = ev => {
                if (claimed) return;
                claimed = true;
                showDynamic();
                player.focus({preventScroll:true});
                surface.setPointerCapture?.(ev.pointerId);
            };
'''
          new = '''            const capturePointer = pointerId => {
                try {
                    if (!surface.hasPointerCapture?.(pointerId)) surface.setPointerCapture?.(pointerId);
                } catch (err) {
                    console.debug('WebRTC PTZ: pointer capture unavailable', err);
                }
            };
            const releasePointer = pointerId => {
                try {
                    if (surface.hasPointerCapture?.(pointerId)) surface.releasePointerCapture?.(pointerId);
                } catch (err) {
                    console.debug('WebRTC PTZ: pointer release unavailable', err);
                }
            };
            const claimPointer = ev => {
                if (claimed) return;
                claimed = true;
                showDynamic();
                player.focus({preventScroll:true});
                capturePointer(ev.pointerId);
            };
'''
          if old not in s:
              raise SystemExit('claimPointer block not found')
          s = s.replace(old, new, 1)

          old = '''                if (ev.pointerType === 'touch' && physicalPointers.size > 1) {
                    touchBlocked = true;
                    if (activePointer !== null) {
                        activePointer = null;
                        claimed = false;
                        stopMove(true);
                    }
                    return;
                }
'''
          new = '''                if (ev.pointerType === 'touch' && physicalPointers.size > 1) {
                    touchBlocked = true;
                    if (activePointer !== null) {
                        const previousPointer = activePointer;
                        activePointer = null;
                        claimed = false;
                        releasePointer(previousPointer);
                        stopMove(true);
                    }
                    return;
                }
'''
          if old not in s:
              raise SystemExit('multitouch block not found')
          s = s.replace(old, new, 1)

          old = '''                claimed = ev.pointerType !== 'touch';
                if (claimed) {
                    claimPointer(ev);
                    showDynamic();
                    player.focus({preventScroll:true});
                    surface.setPointerCapture?.(ev.pointerId);
                    ev.preventDefault(); ev.stopPropagation();
                }
'''
          new = '''                claimed = ev.pointerType !== 'touch';
                // Capture the first pointer immediately, including touch. Delaying
                // capture until the finger leaves the deadband lets mobile/browser
                // gesture handling cancel or redirect the pointer stream. We still
                // delay logical joystick ownership for touch until the deadband is
                // crossed, so a second finger can release capture and hand off to pinch.
                capturePointer(ev.pointerId);
                if (claimed) {
                    showDynamic();
                    player.focus({preventScroll:true});
                    ev.preventDefault(); ev.stopPropagation();
                }
'''
          if old not in s:
              raise SystemExit('begin capture block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)

          m = Path('custom_components/webrtc/manifest.json')
          ms = m.read_text()
          if '"version": "3.6.17"' not in ms:
              raise SystemExit('expected 3.6.17 manifest')
          m.write_text(ms.replace('"version": "3.6.17"', '"version": "3.6.18"', 1))

          c = Path('CHANGELOG.md')
          cs = c.read_text()
          entry = '''# Changelog\n\n## 3.6.18\n- Reused `initial_stream` now copies the source video's actual rendered box ratio, so forced overview aspect ratios such as 16:9 carry through during handoff.\n- Mobile physical joystick captures the first touch pointer immediately, preventing the browser from losing the drag stream before the joystick deadband is crossed; second-touch handoff still releases capture for DigitalPTZ pinch.\n\n'''
          if not cs.startswith('# Changelog\n\n'):
              raise SystemExit('unexpected changelog format')
          c.write_text(entry + cs[len('# Changelog\n\n'):])
          PY

      - name: Validate
        run: |
          node --check custom_components/webrtc/www/webrtc-camera.js
          python -m json.tool custom_components/webrtc/manifest.json >/dev/null

      - name: Commit clean production diff
        run: |
          git config user.name D3XT3R
          git config user.email d3xt3rsl4b@gmail.com
          git rm .github/workflows/patch-3618.yml
          git add custom_components/webrtc/www/webrtc-camera.js custom_components/webrtc/manifest.json CHANGELOG.md
          git commit -m "3.6.18: fix mobile joystick capture and initial aspect"
          git push
