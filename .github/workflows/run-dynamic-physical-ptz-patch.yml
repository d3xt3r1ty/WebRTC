name: Run dynamic physical PTZ patch

on:
  push:
    branches: [feature/dynamic-physical-ptz]
    paths:
      - .github/workflows/run-dynamic-physical-ptz-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dynamic-physical-ptz
      - run: python tools/patch_dynamic_physical_ptz.py
      - run: node --check custom_components/webrtc/www/webrtc-camera.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/webrtc/www/webrtc-camera.js custom_components/webrtc/manifest.json
          git commit -m "Add dynamic relative physical PTZ controls"
          git push origin feature/dynamic-physical-ptz
