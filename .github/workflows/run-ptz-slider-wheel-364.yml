name: Run PTZ slider/wheel 3.6.4 hotfix

on:
  push:
    branches:
      - fix/ptz-slider-wheel-3.6.4

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ptz-slider-wheel-3.6.4
      - name: Apply patch
        run: python tools/patch_ptz_slider_wheel_364.py
      - name: Validate JavaScript
        run: node --check custom_components/webrtc/www/webrtc-camera.js
      - name: Validate manifest JSON
        run: python -m json.tool custom_components/webrtc/manifest.json > /dev/null
      - name: Show diff
        run: git diff --check && git diff --stat && git diff
      - name: Commit patched files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/webrtc/www/webrtc-camera.js custom_components/webrtc/manifest.json
          git commit -m "Fix PTZ zoom slider and mouse wheel" || exit 0
          git push
